[package]
name = "dfint-installer"
version = "0.7.2"
edition = "2024"
build = "build.rs"

[profile.release]
opt-level = 's'   # Smaller than 'z' in the Linux release build
lto = true        # Enable link-time optimization
codegen-units = 1 # Reduce number of codegen units to increase optimizations
panic = 'abort'   # Abort on panic
strip = true      # Strip symbols from binary

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
crc32fast = "1.5.2"
eframe = { version = "0.37.0", default-features = false, features = [
  "accesskit",
  "default_fonts",
  "glow",
  "links",
  "wayland",
  "x11",
] }
egui = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }
egui-notify = "0.24.0"
egui_extras = { version = "0.37.0", default-features = false, features = ["image"] }
env_logger = { version = "0.11.11", default-features = false }
exe = "0.5.7"
rfd = "0.17.2"
include_dir = "0.7.4"
memchr = "2"
serde = "1.0.229"
serde_derive = "1.0.229"
serde_json = "1.0.151"
static_init = "1.0.4"
sys-locale = "0.3.2"
sysinfo = { version = "0.40.0", default-features = false, features = ["system"] }
ureq = { version = "3.4.2", features = ["json"] }

[package]
name = "dfint-installer"
version = "0.6.5"
edition = "2024"
build = "build.rs"

[profile.release]
opt-level = 'z'   # Optimize for size
lto = true        # Enable link-time optimization
codegen-units = 1 # Reduce number of codegen units to increase optimizations
panic = 'abort'   # Abort on panic
strip = true      # Strip symbols from binary

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[dependencies]
anyhow = "1.0.104"
async-std = "1.13.2"
checksum = "0.2.1"
chrono = "0.4.45"
crc32fast = "1.5.2"
eframe = "0.33.3"
egui-modal = "0.6.0"
egui-notify = "0.22.0"
egui_extras = { version = "0.33.3", features = ["all_loaders"] }
egui_file = "0.26.0"
env_logger = "0.11.11"
exe = "0.5.7"
futures = "0.3.34"
include_dir = "0.7.4"
regex = "1.13.1"
serde = "1.0.229"
serde_derive = "1.0.229"
serde_json = "1.0.151"
static_init = "1.0.4"
sys-locale = "0.3.2"
sysinfo = "0.39.6"
ureq = { version = "3.4.2", features = ["json"] }
